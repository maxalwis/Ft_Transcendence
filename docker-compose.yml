services:
  nginx:
    image: localhost/transcendence_nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - nginx_certs:/etc/nginx/certs
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - transcendence_network

  postgres:
    image: docker.io/postgis/postgis:16-3.4-alpine
    container_name: main_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-transcendence} -d ${POSTGRES_DB:-transcendence}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    command:
      - 'postgres'
      - '-c'
      - 'log_timezone=Europe/Paris'
      - '-c'
      - 'log_line_prefix=[DB]  - %m     '

  redis:
    image: docker.io/library/redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    networks:
      - transcendence_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    image: localhost/transcendence_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
        - MAIL_HOST=${MAIL_HOST:-mailpit}
        - MAIL_PORT=${MAIL_PORT:-1025}
        - MAIL_FROM=${MAIL_FROM:-no-reply@transcendence.local}
        - NODE_ENV=development
        - PORT=${BACKEND_PORT:-3000}
        - LIBRETRANSLATE_URL=${LIBRETRANSLATE_URL}
        - UV_THREADPOOL_SIZE=2
        - NODE_OPTIONS=--max-old-space-size=2048
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      - ./backend:/app:z
      - backend_node_modules:/app/node_modules
      - avatars_data:/app/uploads/avatars
    depends_on:
      postgres:
        condition: service_started
      libretranslate:
        condition: service_started
    networks:
      - transcendence_network
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q --spider http://localhost:${BACKEND_PORT:-3000}/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ['sh', '-c', 'npx prisma generate && npx prisma db push && exec node -r dotenv/config node_modules/.bin/nest start --watch dotenv_config_path=.env']

  worker:
    image: localhost/transcendence_worker:latest
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker
    restart: unless-stopped
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - worker_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_started
    networks:
      - transcendence_network

  frontend:
    image: localhost/transcendence_frontend:latest
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
      - VITE_BACKEND_URL=http://backend:3000
      - HTTPS_PORT=${HTTPS_PORT:-8443}
      - VITE_HTTPS_PORT=${HTTPS_PORT:-8443}
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - NPM_CONFIG_FUND=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_LOGLEVEL=silent
      - UV_THREADPOOL_SIZE=2
      - NODE_OPTIONS=--max-old-space-size=2048
    ports:
      - '5173:5173'
    volumes:
      - ./front:/app:z
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - transcendence_network
    command: ['sh', '-c', 'npm run dev -- --host 0.0.0.0']

  prisma-studio:
    image: localhost/transcendence_backend:latest
    container_name: prisma_studio
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - '${STUDIO_PORT:-5555}:${STUDIO_PORT:-5555}'
    volumes:
      - ./backend:/app:z
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - transcendence_network
    command: ['npm', 'run', 'studio']
    profiles:
      - prisma-studio

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      - xpack.security.enabled=false
      - 'logger.level=WARN'
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elasticsearch/config/log4j2.properties:/usr/share/elasticsearch/config/log4j2.properties:z
      - ./elasticsearch/config/empty-aws-config:/usr/share/elasticsearch/.aws/config:ro,z
    networks:
      - transcendence_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -s http://localhost:9200/_cluster/health | grep -q 'status.*green\\|status.*yellow'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: 'json-file'
    profiles:
      - 'elk'

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: logstash
    restart: unless-stopped
    volumes:
      - ./logstash/config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:z
    command: logstash -f /usr/share/logstash/pipeline/logstash.conf
    ports:
      - '5044:5044'
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.monitoring.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - transcendence_network
    logging:
      driver: 'json-file'
    profiles:
      - 'elk'

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTIC_APM_ACTIVE=false
      - ELASTIC_APM_LOG_LEVEL=off
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - '5601:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - transcendence_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5601/api/status']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: 'json-file'
    profiles:
      - 'elk'

  kibana-setup:
    image: docker.io/curlimages/curl:latest
    container_name: kibana_setup
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - ./kibana/scripts/setup.sh:/usr/local/bin/setup.sh:z
      - ./kibana/scripts/kibana-dashboard.ndjson:/usr/local/bin/kibana-dashboard.ndjson:z
    networks:
      - transcendence_network
    entrypoint: ['/bin/sh', '/usr/local/bin/setup.sh']
    logging:
      driver: 'json-file'
    profiles:
      - 'elk'

  libretranslate:
    build:
      context: ./libretranslate
      dockerfile: Dockerfile
    image: localhost/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - LT_LOAD_ONLY=fr,en,es,ar
    volumes:
      - libretranslate_models:/home/libretranslate/.local:rw
    networks:
      - transcendence_network
    healthcheck:
      test: ['CMD-SHELL', './venv/bin/python scripts/healthcheck.py']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - transcendence_network

volumes:
  postgres_data:
  backend_node_modules:
  worker_node_modules:
  frontend_node_modules:
  nginx_certs:
  libretranslate_models:
  avatars_data:
  elasticsearch_data:

networks:
  transcendence_network:
    driver: bridge