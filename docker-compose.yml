services:
  postgres:
    image: docker.io/postgis/postgis:16-3.4-alpine
    container_name: main_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: transcendence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence -d transcendence"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://transcendence:changeme@postgres:5432/transcendence?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence_network


volumes:
  postgres_data:
  backend_node_modules:

networks:
  transcendence_network:
    driver: bridge
