services:
  nginx:
    image: localhost/transcendence_nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    networks:
      - transcendence_network

  postgres:
    image: docker.io/postgis/postgis:16-3.4-alpine
    container_name: main_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-transcendence} -d ${POSTGRES_DB:-transcendence}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    command:
      - 'postgres'
      - '-c'
      - 'log_timezone=Europe/Paris'
      - '-c'
      - 'log_line_prefix=[DB]  - %m     '
  redis:
    image: docker.io/library/redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    networks:
      - transcendence_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: localhost/transcendence_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://transcendence:changeme@postgres:5432/transcendence?schema=public}
      PORT: 3000
    ports:
      - '${BACKEND_PORT}:3000'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence_network
    # Ensure first launch of the project is made properly by generating Prisma client and running migrations before starting the backend server
    command: ['sh', '-c', 'npx prisma generate && npx prisma migrate deploy && exec npm run start']

  worker:
    image: localhost/transcendence_worker:latest
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker
    restart: unless-stopped
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
    volumes:
      - worker_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - transcendence_network

  frontend:
    image: localhost/transcendence_frontend:latest
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
      - HTTPS_PORT=${HTTPS_PORT:-8443}
    volumes:
      - ./front:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - transcendence_network
    command: ['sh', '-c', 'npm install && npm run dev -- --host 0.0.0.0']

  prisma-studio:
    image: localhost/transcendence_backend:latest
    container_name: prisma_studio
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://transcendence:changeme@postgres:5432/transcendence?schema=public}
    ports:
      - '${STUDIO_PORT}:${STUDIO_PORT}'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - transcendence_network
    command: ['npm', 'run', 'studio']

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      - xpack.security.enabled=false
      - 'logger.level=WARN'
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elasticsearch/config/log4j2.properties:/usr/share/elasticsearch/config/log4j2.properties:z
    networks:
      - transcendence_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -s http://localhost:9200/_cluster/health | grep -q 'status.*green\\|status.*yellow'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: logstash
    restart: unless-stopped
    volumes:
      - ./logstash/config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:z
    command: logstash -f /usr/share/logstash/pipeline/logstash.conf
    ports:
      - '5044:5044'
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.monitoring.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - transcendence_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTIC_APM_ACTIVE=false
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:z
    ports:
      - '5601:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - transcendence_network

  kibana-setup:
    image: docker.io/library/alpine:latest
    container_name: kibana_setup
    depends_on:
      kibana:
        condition: service_started
    volumes:
      - ./kibana/scripts/setup.sh:/usr/local/bin/setup.sh:z
    networks:
      - transcendence_network
    command: >
      sh -c "
        apk add --no-cache curl &&
        chmod +x /usr/local/bin/setup.sh &&
        /usr/local/bin/setup.sh
      "

volumes:
  postgres_data:
  backend_node_modules:
  worker_node_modules:
  frontend_node_modules:
  elasticsearch_data:
  nginx_certs:

networks:
  transcendence_network:
    driver: bridge
