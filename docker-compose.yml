services:
  nginx:
    image: localhost/transcendence_nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - nginx_certs:/etc/nginx/certs
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - transcendence_network

  postgres:
    image: docker.io/postgis/postgis:16-3.4-alpine
    container_name: main_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    command:
      - 'postgres'
      - '-c'
      - 'log_timezone=Europe/Paris'
      - '-c'
      - 'log_line_prefix=[DB]  - %m     '

  redis:
    image: docker.io/library/redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    networks:
      - transcendence_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    image: localhost/transcendence_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-3000}
    ports:
      - '${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}'
    volumes:
      - ./backend:/app:z
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O- http://localhost:${BACKEND_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ['sh', '-c', 'npx prisma generate && npx prisma migrate deploy && exec npm run start']

  worker:
    image: localhost/transcendence_worker:latest
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker
    restart: unless-stopped
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    volumes:
      - worker_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - transcendence_network

  frontend:
    image: localhost/transcendence_frontend:latest
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
      - HTTP_PORT=${HTTP_PORT}
    volumes:
      - ./front:/app:z
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - transcendence_network
    command: ['sh', '-c', 'npm install && npm run dev -- --host 0.0.0.0']

  prisma-studio:
    image: localhost/transcendence_backend:latest
    container_name: prisma_studio
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - '${STUDIO_PORT}:${STUDIO_PORT}'
    volumes:
      - ./backend:/app:z
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - transcendence_network
    command: ['npm', 'run', 'studio']

volumes:
  postgres_data:
  backend_node_modules:
  worker_node_modules:
  frontend_node_modules:
  nginx_certs:

networks:
  transcendence_network:
    driver: bridge
