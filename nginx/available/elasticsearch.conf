  # -- Elasticsearch (xpack security basic auth) -------------
  # Enabled when the "elk" or "tools" compose profile is active
  # (see entrypoint.sh, which symlinks this file into /etc/nginx/enabled/).
  server {
    access_log off;
    listen 447 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # No nginx basic auth here: Elasticsearch authenticates every request itself
    # (xpack.security, user `elastic` / ELASTIC_PASSWORD). Both would compete for the
    # single Authorization header.

    location / {
      set $es_upstream http://elasticsearch:9200;
      proxy_pass $es_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
