# nginx/nginx.conf
# Reverse proxy (dev): HTTPS only. Bind-mounted straight to /etc/nginx/nginx.conf
# (see docker-compose.yml). Ports below are container ports; compose publishes
# them on the host (defaults in brackets).
#   :443 (8443)      -> nginx reverse proxy
#   :443/api/*       -> NestJS backend (the /api prefix is stripped, see trailing slash)
#   :443/socket.io/  -> backend (real-time WebSocket)
#   :443/*           -> Vite dev server (front + HMR)
#   :444 (8444)      -> Prisma Studio (basic auth)
#   :445 (8445)      -> Kibana (basic auth)
#   :446 (8446)      -> Mailpit
#   :447 (8447)      -> Elasticsearch (basic auth)
#
# Basic auth credentials (ADMIN_AUTH_USER/ADMIN_AUTH_PASSWORD) are read from
# .env and hashed into /etc/nginx/.htpasswd by entrypoint.sh at container start.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Needed by the "set $x http://host:port; proxy_pass $x;" blocks below (names are
  # resolved at request time, so optional services don't stop nginx from starting).
  # Generated at container start by entrypoint.sh from /etc/resolv.conf.
  include /etc/nginx/resolver.conf;

  server {
    access_log off;
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # -- REST API -> backend ---------------------------------
    # trailing slash on proxy_pass => /api/health becomes /health on the backend
    location /api/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # -- Real-time WebSocket -> backend ----------------------
    location /socket.io/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host       $host;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # -- Front (Vite dev server + HMR over wss) -> frontend --
    location / {
      proxy_pass http://frontend:5173;
      proxy_http_version 1.1;
      proxy_set_header Host       $host;
      proxy_set_header Upgrade    $http_upgrade;   # required for hot-reload (HMR)
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # -- Uploaded files (avatars, etc.) -> backend -----------
    location /uploads/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    access_log off;
    listen 444 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    auth_basic           "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
      set $studio_upstream http://prisma-studio:5555;
      proxy_pass $studio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }

  server {
    access_log off;
    listen 445 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    auth_basic           "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
      set $kibana_upstream http://kibana:5601;
      proxy_pass $kibana_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }

  server {
    access_log off;
    listen 446 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
      proxy_pass http://mailpit:8025;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }

  server {
    access_log off;
    listen 447 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    auth_basic           "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
      set $es_upstream http://elasticsearch:9200;
      proxy_pass $es_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }


}
