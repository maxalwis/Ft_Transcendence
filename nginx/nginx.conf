# nginx/nginx.conf
# Reverse proxy (dev): single entry point. Listens on port 80 inside the
# container, which compose publishes on HTTP_PORT (default 8080).
#   :8080       -> nginx reverse proxy
#   :8080/api/*      -> NestJS backend (the /api prefix is stripped, see trailing slash)
#   :8080/socket.io/ -> backend (real-time WebSocket, once the gateway exists)
#   :8080/*          -> Vite dev server (front + HMR)
#   :5555            -> Prisma Studio
#   :5601            -> Kibana
#   :9200            -> Elasticsearch

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    access_log off;
    listen 80;
    server_name localhost;

    # -- REST API -> backend ---------------------------------
    # trailing slash on proxy_pass => /api/health becomes /health on the backend
    location /api/ {
      proxy_pass http://backend:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # -- Real-time WebSocket -> backend ----------------------
    location /socket.io/ {
      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host       $host;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # -- Front (Vite dev server + HMR) -> frontend -----------
    location / {
      proxy_pass http://frontend:5173;
      proxy_http_version 1.1;
      proxy_set_header Host       $host;
      proxy_set_header Upgrade    $http_upgrade;   # required for hot-reload (HMR)
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }
}
