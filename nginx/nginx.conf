# nginx/nginx.conf
# Reverse proxy (dev): single HTTPS entry point. Listens on port 443 inside the
# container, which compose publishes on HTTPS_PORT (default 8443).
#   /api/*      -> NestJS backend (the /api prefix is stripped, see trailing slash)
#   /health     -> NestJS backend health check
#   /socket.io/ -> backend (real-time WebSocket, once the gateway exists)
#   /*          -> Vite dev server (front + HMR)

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    access_log off;
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    
    # -- Health check route -> backend ----------------------
    # Redirect /health route directly to the backend container
    location /health {
      proxy_pass http://backend:3000/health;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -- REST API -> backend ---------------------------------
    # trailing slash on proxy_pass => /api/health becomes /health on the backend
    location /api/ {
      proxy_pass http://backend:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # -- Real-time WebSocket -> backend ----------------------
    location /socket.io/ {
      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host       $host;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # -- Front (Vite dev server + HMR over wss) -> frontend --
    location / {
      proxy_pass http://frontend:5173;
      proxy_http_version 1.1;
      proxy_set_header Host       $host;
      proxy_set_header Upgrade    $http_upgrade;   # required for hot-reload (HMR)
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }
}
