input {
  tcp {
    port => 5044
    codec => json
  }
}

filter {
  # 1. Process HTTP metrics only if present
  if [http][statusCode] {
    mutate {
      add_field => {
        "response_time_ms" => "%{[http][duration]}"
        "http.response.status_code" => "%{[http][statusCode]}"
      }
    }

    mutate {
      convert => {
        "response_time_ms" => "integer"
        "http.response.status_code" => "integer"
      }
    }

    # Business context mapping
    if [http.response.status_code] >= 500 {
      mutate {
        add_field => { "system_health_status" => "System Errors & Downtime" }
        add_tag => [ "5xx_error" ]
      }
    } else {
      mutate {
        add_field => { "system_health_status" => "Healthy" }
      }
    }
  }

  # 2. Add path field for page speed / route analytics
  if [http][url] {
    mutate {
      add_field => { "request_path" => "%{[http][url]}" }
    }
  }

  # 3. Standardize NestJS severity level
  if [level] {
    mutate {
      add_field => { "log_severity" => "%{level}" }
      lowercase => [ "log_severity" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nestjs-logs-%{+YYYY.MM.dd}"
  }
}