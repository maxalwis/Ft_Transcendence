input {
  tcp {
    port => 5044
    codec => json
  }
}

filter {
  # If NestJS sends an explicit @timestamp field, parse it as ISO8601 UTC
  if [@timestamp] {
    date {
      match => [ "@timestamp", "ISO8601" ]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  # Ensure numeric types are strictly typed for Kibana metrics
  mutate {
    convert => {
      "[http][duration]" => "integer"
      "[http][statusCode]" => "integer"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nestjs-logs-%{+YYYY.MM.dd}"
    # Least-privilege user created by elasticsearch/scripts/setup.sh (write on nestjs-logs-* only)
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    # The nestjs-logs index template (ILM retention) is managed by setup.sh, not Logstash
    manage_template => false
  }
}